org.gradle.parallel=true
android.defaults.buildfeatures.shaders=false
android.useAndroidX=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx6g -Xms256m -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# Uncomment, sync Gradle, and run the debug build to walk through the move from the beta channel to the
# stable one (see ChannelMigration) without publishing a release to trigger it: the app then behaves as
# a beta that has just seen the stable build published. Comment it back out when done.
# Debug builds only — beta, canary and release ignore it whatever this says, so leaving it on by
# accident can never reach anyone.
#omnify.simulateChannelSwitch=true
