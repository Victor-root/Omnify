[versions]
desugaring = "2.1.5"
# Tied to the Gradle wrapper, which this cannot move without: 9.1.0 needed Gradle 9.3.1, 9.3.1 needs
# 9.5.0, and the wrapper is on 9.5.1 for that reason. This is also what raises the ceiling on
# compileSdk, since an AGP only knows the API levels of its day (9.1.0 stopped at 36, 9.3.1 knows 37).
agp = "9.3.1"
material = "1.14.0"
activity = "1.13.0"
app-compat = "1.7.1"
core = "1.19.0"
datastore = "1.2.1"
fragment = "1.8.9"
lifecycle = "2.11.0"
recycler-view = "1.4.0"
# Held at 2.6.2 to match Room. room-runtime 2.8.4 declares androidx.sqlite 2.6.2 exactly, so raising
# this alone would run Room against a version it was never built against, and Gradle resolves to the
# higher one silently. That mismatch is the kind that compiles fine and fails when the database is
# opened. It moves when Room does; 2.8.4 is the newest Room.
sqlite = "2.6.2"
test-ext = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"
work = "2.11.2"
profileinstaller = "1.4.1"
# Held at 3.4.0, which is the release built against Kotlin 2.3.10, exactly the compiler here. Each
# coil release tracks the Kotlin of its day (3.3.0 -> 2.2.0, 3.4.0 -> 2.3.10, 3.5.0 -> 2.4.0), so
# 3.5.0 means moving to Kotlin 2.4, which KSP has no release for. It moves when Kotlin does.
coil = "3.4.0"
leakcanary = "2.14"
hilt = "2.60.1"
# Unrelated to the dagger `hilt` version above, which the two version refs make easy to confuse: they
# release on their own schedules.
hiltExt = "1.4.0"
kotlin = "2.3.21"
coroutines = "1.11.0"
datetime = "0.8.0"
serialization = "1.11.0"
# Moves with Kotlin, never alone: KSP's last digit is its own, but each release is built against one
# Kotlin (2.3.7 through 2.3.11 all against 2.3.20). 2.3.11 is the newest of the 2.3 series, and there
# is no 2.4 series at all, which is what holds Kotlin here.
ksp = "2.3.11"
ktor = "3.5.2"
libsu = "6.0.0"
room = "2.8.4"
# Held at 13.0.0 on purpose. Every 13.1.x raises its own minSdk to 24, which would drop this app's
# Android 6 support, and makes Shizuku.newProcess private, which ShizukuInstaller.exec() is built on
# (already deprecated there, with no drop-in replacement: Shizuku's own answer is a bound AIDL user
# service, a different execution model). Moving up means deciding to leave Android 6 behind and
# rewriting that installer, not bumping a number. No known vulnerability in 13.0.0.
shizuku = "13.0.0"
image-viewer = "1.0.1"
mlkit-translate = "17.0.3"
mlkit-langid = "17.0.6"
commonmark = "0.30.0"
junit-jupiter = "6.1.2"
robolectric = "4.16.1"
test-core = "1.7.0"
arch-core-testing = "2.2.0"
mockk = "1.14.11"
turbine = "1.2.1"
compose-bom = "2026.06.01"
# Held at alpha18, and no longer for the compileSdk reason: this version is what actually decides the
# compose-ui/foundation/runtime version, since material3 requires a far newer one than the BOM pins
# (1.4.0 there) and the higher of the two wins. alpha18 asks for 1.11.0-beta02, which the BOM's stable
# 1.11.4 beats, so ui lands on a stable release. Every alpha above it asks for a 1.12.0 pre-release
# instead, which no BOM beats yet, so taking one would quietly move the whole of Compose off stable.
# It moves when a BOM ships 1.12.0 final.
compose-material = "1.5.0-alpha18"
compose-navigation = "2.9.8"
detekt = "1.23.8"
# Held at 0.4.25, the last release built against detekt 1.23.8 (the version above, and the newest
# stable detekt there is). Every 0.5.x and 0.6.x is built against a detekt 2.0.0-alpha instead, so
# raising this alone would quietly pull an alpha detekt into the build. It moves when detekt 2.0 is
# stable, not before.
detekt-compose = "0.4.25"

